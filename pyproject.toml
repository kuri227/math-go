[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-go-hmer-poc"
version = "0.1.0"
description = "Local handwritten mathematical expression recognition PoC"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=10.4,<12",
  "pydantic>=2.10,<3",
  "tomli>=2.2; python_version < '3.11'",
]

[project.optional-dependencies]
benchmark = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

